<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/>
    <stop offset=".52" stop-color="#17112F"/>
    <stop offset="1" stop-color="#06202D"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A855F7"/>
    <stop offset=".5" stop-color="#6366F1"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <radialGradient id="glow1"><stop stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".045"/>
  </pattern>
</defs>

<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="100" cy="90" r="270" fill="url(#glow1)"/>
<circle cx="1100" cy="280" r="260" fill="url(#glow2)"/>

<!-- subtle code panel -->
<g transform="translate(62 70)">
 <rect width="285" height="220" rx="18" fill="#060D18" stroke="#334155"/>
 <circle cx="23" cy="24" r="5" fill="#FB7185"/>
 <circle cx="41" cy="24" r="5" fill="#FBBF24"/>
 <circle cx="59" cy="24" r="5" fill="#34D399"/>
 <text x="22" y="58" font-family="monospace" font-size="11" fill="#64748B">abinaya.dev</text>
 <text x="22" y="92" font-family="monospace" font-size="13" fill="#C084FC">const</text>
 <text x="78" y="92" font-family="monospace" font-size="13" fill="#E5E7EB">developer = {</text>
 <text x="38" y="121" font-family="monospace" font-size="12" fill="#22D3EE">frontend:</text>
 <text x="125" y="121" font-family="monospace" font-size="12" fill="#F8FAFC">'React'</text>
 <text x="38" y="148" font-family="monospace" font-size="12" fill="#22D3EE">backend:</text>
 <text x="115" y="148" font-family="monospace" font-size="12" fill="#F8FAFC">'Java'</text>
 <text x="38" y="175" font-family="monospace" font-size="12" fill="#22D3EE">database:</text>
 <text x="130" y="175" font-family="monospace" font-size="12" fill="#F8FAFC">'MySQL'</text>
 <text x="22" y="202" font-family="monospace" font-size="13" fill="#C084FC">};</text>
</g>

<!-- main hero -->
<text x="410" y="93" font-family="Arial,sans-serif" font-size="19" fill="#C084FC">HELLO, I'M</text>
<text x="406" y="155" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">ABINAYA P.</text>
<rect x="408" y="178" width="500" height="4" rx="2" fill="url(#accent)"/>
<text x="408" y="218" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#E2E8F0">REACT + JAVA DEVELOPER</text>
<text x="408" y="252" font-family="Arial,sans-serif" font-size="14" fill="#94A3B8">Building useful digital experiences from idea to implementation.</text>

<!-- floating stack -->
<g transform="translate(408 276)">
 <rect width="100" height="34" rx="17" fill="#111827" stroke="#334155"/>
 <text x="50" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#C4B5FD">REACT</text>
 <rect x="112" width="100" height="34" rx="17" fill="#111827" stroke="#334155"/>
 <text x="162" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#BFDBFE">JAVA</text>
 <rect x="224" width="120" height="34" rx="17" fill="#111827" stroke="#334155"/>
 <text x="284" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#A7F3D0">SPRING BOOT</text>
 <rect x="356" width="100" height="34" rx="17" fill="#111827" stroke="#334155"/>
 <text x="406" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#A5F3FC">MYSQL</text>
</g>

<!-- small status -->
<g transform="translate(1030 70)">
 <rect width="110" height="220" rx="18" fill="#060D18" stroke="#334155"/>
 <circle cx="22" cy="28" r="6" fill="#34D399"/>
 <text x="37" y="32" font-family="Arial" font-size="10" fill="#E5E7EB">BUILDING</text>
 <text x="20" y="70" font-family="monospace" font-size="9" fill="#64748B">CURRENT</text>
 <text x="20" y="94" font-family="Arial" font-size="11" fill="#CBD5E1">React</text>
 <text x="20" y="116" font-family="Arial" font-size="11" fill="#CBD5E1">Java</text>
 <text x="20" y="138" font-family="Arial" font-size="11" fill="#CBD5E1">Spring</text>
 <text x="20" y="160" font-family="Arial" font-size="11" fill="#CBD5E1">MySQL</text>
 <text x="20" y="182" font-family="monospace" font-size="9" fill="#64748B">STATUS</text>
 <text x="20" y="204" font-family="Arial" font-size="11" fill="#C084FC">learning →</text>
</g>

<rect x="0" y="356" width="1200" height="4" fill="url(#accent)"/>
</svg>