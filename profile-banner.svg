  </pattern>
  <filter id="soft">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<circle cx="170" cy="80" r="180" fill="url(#glow1)" filter="url(#soft)"/>
<circle cx="1080" cy="300" r="220" fill="url(#glow2)" filter="url(#soft)"/>

